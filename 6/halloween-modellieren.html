<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Halloween-Mathe – Mathe 6</title>
<style>
:root{
  --bg:#f6f3ef; --card:#ffffff; --ink:#1d2733; --muted:#5d6b7a;
  --blue:#1f5f99; --blueSoft:#e6eef7; --orange:#d9661f; --orangeSoft:#fdeee2;
  --purple:#4b2e6b; --green:#3f8f3a; --greenSoft:#e5f4e1; --red:#c0392b; --redSoft:#fbe9e7;
  --yellow:#fff3b0; --yellowLine:#e8b400; --amberSoft:#fff6dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;touch-action:manipulation}
body{font-size:19px;line-height:1.4;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--purple);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:22px;margin:0;font-weight:800}
header .btn{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;min-height:46px}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{font-size:19px;margin:0 0 10px;color:var(--purple)}
.muted{color:var(--muted);font-size:16px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 18px;min-height:52px;background:var(--blueSoft);color:var(--blue);cursor:pointer}
.btn.main{background:var(--orange);color:#fff}
.btn.tipp{background:var(--yellow);color:#6b5200;border:2px solid var(--yellowLine)}
.btn:disabled{opacity:.4}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plan div{background:var(--orangeSoft);border-radius:14px;padding:10px 12px;font-size:16px}
.plan b{display:block;font-size:18px;color:var(--orange)}
@media (max-width:700px){.plan{grid-template-columns:1fr 1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;min-height:104px;border:0;font:inherit;text-align:left;cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:46px}
.tile b{display:block;font-size:20px}
.tile span{color:var(--muted);font-size:16px}
.frage{font-size:27px;font-weight:800;line-height:1.25;margin:4px 0 8px}
.gnum{display:inline-block;background:var(--purple);color:#fff;border-radius:10px;padding:2px 10px;font-weight:800;font-size:15px}
table.data{border-collapse:collapse;width:100%;font-size:18px}
table.data th,table.data td{border-bottom:1.5px solid #e6e0d8;padding:8px;text-align:left;vertical-align:middle}
table.data th{font-size:15px;color:var(--muted)}
table.data th:not(:first-child){text-align:right}
table.data td.n{text-align:right;white-space:nowrap;font-weight:700}
.note{background:var(--blueSoft);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:17px}
.assume{background:var(--amberSoft);border-left:5px solid var(--yellowLine);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:17px}
.prospekt{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.preis{border:2px dashed #e0a86f;border-radius:14px;padding:10px;background:#fffaf4;text-align:center}
.preis .e{font-size:38px}
.preis .t{font-size:16px;min-height:42px}
.preis .p{font-size:24px;font-weight:900;color:var(--red)}
.tipps{display:flex;gap:10px;flex-wrap:wrap}
.hint{background:#fffaf0;border:2px solid var(--yellowLine);border-radius:14px;padding:10px 14px;margin-top:12px}
.hint .k{background:var(--yellow);color:#6b5200;border-radius:8px;padding:2px 8px;font-weight:800;font-size:15px;margin-right:6px}
.check{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.check input{font:inherit;font-size:26px;font-weight:800;width:170px;height:56px;border:3px solid #9fb3c8;border-radius:12px;padding:0 12px;text-align:right}
.check .u{font-size:20px;font-weight:700}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:600}
.fb.good{background:var(--greenSoft);color:#245d20}
.fb.mid{background:var(--amberSoft);color:#7a5400}
.fb.bad{background:var(--redSoft);color:#8e2a20}
.extra{border:2px solid #d8c9ea;background:#faf7ff}
.extra h2{color:var(--purple)}
.hidden{display:none!important}
svg{max-width:100%;height:auto;display:block}
.seed{cursor:pointer}
.roles{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.roles span{background:var(--blueSoft);color:var(--blue);border-radius:10px;padding:4px 10px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>🎃 Halloween-Mathe</h1>
  <button class="btn hidden" id="homeBtn" onclick="go('')">← alle Gruppen</button>
</header>
<main id="app"></main>

<script>
// ---------- Gruppen-Daten ----------
const PLAN = `<div class="plan">
  <div><b>1 Verstehen</b>Was sollen wir herausfinden?</div>
  <div><b>2 Annahmen</b>Was wissen wir? Was schätzen wir?</div>
  <div><b>3 Rechnen</b>Rechnung auf den Forscherbogen</div>
  <div><b>4 Prüfen</b>Passt das? Ergebnis-Check unten</div>
</div>`;

function fr(z,n){return `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 2px"><span style="border-bottom:2.5px solid currentColor;padding:0 3px">${z}</span><span style="padding:0 3px">${n}</span></span>`;}

const G = [
{ id:"g1", icon:"🧻", title:"Mumie", sub:"Klopapier-Rollen",
  frage:"Wie viele Rollen Klopapier braucht man, um ein Kind komplett als Mumie einzuwickeln?",
  data:`
  <div style="display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;align-items:center" class="mgrid">
  <svg viewBox="0 0 200 330" aria-label="Mumie mit Körperteilen">
    <g fill="#f3ead8" stroke="#8a7a5a" stroke-width="2">
      <rect x="72" y="8" width="56" height="60" rx="24"/>
      <rect x="62" y="72" width="76" height="100" rx="10"/>
      <rect x="28" y="78" width="28" height="98" rx="12"/>
      <rect x="144" y="78" width="28" height="98" rx="12"/>
      <rect x="66" y="176" width="30" height="146" rx="12"/>
      <rect x="104" y="176" width="30" height="146" rx="12"/>
    </g>
    <g stroke="#cbbd9c" stroke-width="2">
      <line x1="72" y1="28" x2="128" y2="22"/><line x1="72" y1="50" x2="128" y2="44"/>
      <line x1="62" y1="95" x2="138" y2="88"/><line x1="62" y1="120" x2="138" y2="113"/><line x1="62" y1="145" x2="138" y2="138"/>
      <line x1="66" y1="210" x2="96" y2="205"/><line x1="66" y1="250" x2="96" y2="245"/><line x1="66" y1="290" x2="96" y2="285"/>
      <line x1="104" y1="210" x2="134" y2="205"/><line x1="104" y1="250" x2="134" y2="245"/><line x1="104" y1="290" x2="134" y2="285"/>
      <line x1="28" y1="110" x2="56" y2="106"/><line x1="28" y1="145" x2="56" y2="141"/>
      <line x1="144" y1="110" x2="172" y2="106"/><line x1="144" y1="145" x2="172" y2="141"/>
    </g>
    <circle cx="89" cy="36" r="5" fill="#1d2733"/><circle cx="111" cy="36" r="5" fill="#1d2733"/>
    <g font-size="13" font-weight="700" fill="#4b2e6b">
      <text x="134" y="30">Kopf</text><text x="96" y="128" text-anchor="middle">Rumpf</text>
      <text x="4" y="196">Arm</text><text x="100" y="326" text-anchor="middle" font-size="12">Beine</text>
    </g>
  </svg>
  <div>
    <b>Mumie Max, 12 Jahre, 150 cm groß</b>
    <table class="data">
      <tr><th>Körperteil</th><th>Länge</th><th>Umfang</th></tr>
      <tr><td>Kopf + Hals</td><td class="n">25 cm</td><td class="n">55 cm</td></tr>
      <tr><td>Rumpf</td><td class="n">50 cm</td><td class="n">70 cm</td></tr>
      <tr><td>1 Arm</td><td class="n">50 cm</td><td class="n">22 cm</td></tr>
      <tr><td>1 Bein</td><td class="n">75 cm</td><td class="n">40 cm</td></tr>
    </table>
  </div></div>
  <div class="note">🧻 <b>1 Rolle Klopapier:</b> 150 Blatt. 1 Blatt ist 10 cm lang und 10 cm breit.</div>
  <div class="assume">✏️ <b>Ihr entscheidet:</b> Wickelt ihr jede Stelle nur einmal oder überlappt das Papier? Ihr dürft auch ein Kind aus eurer Gruppe mit dem Lineal messen.</div>`,
  tipps:[
   "Stellt euch den Körper als mehrere Röhren vor: Kopf, Rumpf, 2 Arme, 2 Beine. Rechnet jede Röhre einzeln.",
   "Eine Runde um den Rumpf braucht so viel Papier, wie der Umfang lang ist. Das Papier ist 10 cm breit. Wie viele Runden passen auf den Rumpf (50 cm lang)?",
   "Beispiel Kopf: 25 cm : 10 cm = 2,5 Runden. 2,5 · 55 cm = 137,5 cm. Genauso für Rumpf, Arme und Beine. Alles addieren. Zum Schluss: 1 Rolle = 150 · 10 cm = 1500 cm = 15 m."],
  check:{unit:"Rollen", label:"Wie viele Rollen braucht ihr?", ranges:[
    {max:0.79, cls:"bad", msg:"Das ist zu wenig. Habt ihr alle Körperteile mitgerechnet – auch beide Arme und beide Beine?"},
    {max:4, cls:"good", msg:"Passt! Das ist ein realistisches Ergebnis. Schreibt auf, ob ihr mit Überlappung gerechnet habt – das ist eure wichtigste Annahme."},
    {max:8, cls:"mid", msg:"Ganz schön viel. Das geht nur, wenn ihr sehr oft übereinander wickelt. Prüft auch die Umrechnung von cm in m."},
    {max:1e9, cls:"bad", msg:"Das ist viel zu viel. Prüft die Umrechnung: 1 Rolle = 15 m = 1500 cm."}]},
  extra:"Eine Packung mit 8 Rollen kostet 3,20 €. Was kostet eure Mumie?"
},
{ id:"g2", icon:"🍬", title:"Süßigkeiten-Beute", sub:"Lina geht von Haus zu Haus",
  frage:"Wie viele Süßigkeiten sammelt Lina an Halloween auf ihrem Weg?",
  data:`<div id="street"></div>
  <table class="data" style="margin-top:8px">
    <tr><th>Straße</th><th>Häuser</th><th>So viele machen auf</th></tr>
    <tr><td>🎃 Kürbisstraße</td><td class="n">24</td><td class="n">${fr(3,8)} der Häuser</td></tr>
    <tr><td>👻 Gespensterweg</td><td class="n">32</td><td class="n">${fr(5,8)} der Häuser</td></tr>
  </table>
  <div class="note">🍭 Letztes Jahr bekam Lina an einem Haus meistens 1, 2 oder 3 Süßigkeiten. Einmal gab es sogar eine ganze Handvoll (6 Stück).</div>
  <div class="assume">✏️ <b>Ihr entscheidet:</b> Wie viele Süßigkeiten gibt es pro Haus? Schreibt eure Schätzung auf.</div>`,
  tipps:[
   "Zuerst: Wie viele Häuser machen überhaupt auf? Rechnet für jede Straße einzeln.",
   `${fr(3,8)} von 24 Häusern: erst 24 : 8, dann · 3. Beim Gespensterweg genauso mit ${fr(5,8)} von 32.`,
   "Kürbisstraße: 24 : 8 = 3, 3 · 3 = 9 Häuser machen auf. Gespensterweg genauso rechnen. Dann alle offenen Häuser · eure Süßigkeiten pro Haus (z. B. 2)."],
  check:{unit:"Süßigkeiten", label:"Wie viele Süßigkeiten sammelt Lina?", ranges:[
    {max:9, cls:"bad", msg:"Das ist zu wenig. Habt ihr beide Straßen gerechnet?"},
    {max:24, cls:"mid", msg:"Eher wenig. Prüft: Habt ihr beide Straßen addiert? Wie viel gibt es pro Haus?"},
    {max:100, cls:"good", msg:"Passt! Ein realistisches Ergebnis. Wichtigste Annahme: Wie viele Süßigkeiten gibt es pro Haus?"},
    {max:180, cls:"mid", msg:"Ziemlich viel. Habt ihr nur die Häuser gezählt, die aufmachen? Und gibt es wirklich so viel pro Haus?"},
    {max:1e9, cls:"bad", msg:"Das ist viel zu viel. Nicht alle Häuser machen auf – rechnet mit den Bruchteilen."}]},
  extra:"Lina isst jeden Tag 3 Süßigkeiten, vom 1. November bis Weihnachten (24. Dezember). Wie viele Süßigkeiten bräuchte sie dafür? Reicht ihre Beute?",
  extraCheck:{unit:"Süßigkeiten", ranges:[
    {max:155, cls:"bad", msg:"Zu wenig. Zählt die Tage genau: Der November hat 30 Tage, dazu 24 Tage im Dezember."},
    {max:158, cls:"mid", msg:"Fast! Zählt die Tage noch einmal genau."},
    {max:162, cls:"good", msg:"Richtig: 54 Tage · 3 = 162 Süßigkeiten. Und – reicht Linas Beute?"},
    {max:1e9, cls:"bad", msg:"Zu viel. Der November hat 30 Tage, dazu 24 Tage im Dezember."}]}
},
{ id:"g3", icon:"🎃", title:"Kürbiskerne", sub:"Zählen und hochrechnen",
  frage:"Wie viele Kerne hat der ganze Kürbis?",
  data:`<div style="display:grid;grid-template-columns:minmax(140px,200px) 1fr;gap:16px;align-items:start" class="mgrid">
    <div><svg viewBox="0 0 200 200" id="pie"></svg><p class="muted" style="margin:6px 0 0">Der Kürbis wurde in <b>8 gleich große Stücke</b> geschnitten. Unten seht ihr <b>1 Stück</b>.</p></div>
    <div><svg viewBox="0 0 520 470" id="wedge"></svg>
    <div class="check" style="margin-top:0"><button class="btn" onclick="clearSeeds()">Markierungen löschen</button><span class="muted">Tippt jeden Kern an, den ihr gezählt habt.</span></div></div>
  </div>
  <div class="card" style="background:var(--blueSoft);box-shadow:none;margin:12px 0 0">
    <b>Zählkontrolle:</b> Wie viele Kerne sind in diesem einen Stück?
    <div class="check"><input id="cnt" inputmode="decimal" placeholder="?"><span class="u">Kerne</span><button class="btn main" onclick="checkCount()">prüfen</button></div>
    <div id="cntFb"></div>
  </div>`,
  tipps:[
   "Ihr seht nur 1 von 8 gleichen Stücken. Was wisst ihr dann über die anderen 7 Stücke?",
   "Zählt zuerst die Kerne in dem einen Stück. Tippt jeden Kern an – dann zählt ihr keinen doppelt. Danach: Wie viele Stücke hat der ganze Kürbis?",
   "Beispiel: Ein Stück hat 30 Kerne. Der Kürbis hat 8 Stücke. 8 · 30 = 240 Kerne."],
  check:{unit:"Kerne", label:"Wie viele Kerne hat der ganze Kürbis?", ranges:[
    {max:349, cls:"bad", msg:"Zu wenig. Der Kürbis hat 8 Stücke – habt ihr mit 8 multipliziert?"},
    {max:375, cls:"mid", msg:"Fast! Prüft die Zählkontrolle und eure Malrechnung."},
    {max:376, cls:"good", msg:"Genau! 47 · 8 = 376 Kerne. Eure Annahme: Alle 8 Stücke haben gleich viele Kerne. Stimmt das in echt?"},
    {max:400, cls:"mid", msg:"Fast! Prüft die Zählkontrolle und eure Malrechnung."},
    {max:1e9, cls:"bad", msg:"Zu viel. Der Kürbis hat 8 Stücke, nicht mehr."}]},
  extra:"Für einen gerösteten Kürbiskern-Snack braucht jedes Kind 40 Kerne. Wie viele Kürbisse braucht man für unsere 29 Kinder?",
  extraCheck:{unit:"Kürbisse", ranges:[
    {max:2, cls:"bad", msg:"Zu wenig. 29 Kinder · 40 Kerne – wie viele Kerne sind das?"},
    {max:3, cls:"mid", msg:"Fast! 3 Kürbisse haben 3 · 376 = 1128 Kerne. Reicht das für 29 · 40 Kerne?"},
    {max:4, cls:"good", msg:"Richtig! 29 · 40 = 1160 Kerne. 3 Kürbisse reichen nicht ganz, man braucht 4."},
    {max:1e9, cls:"bad", msg:"Zu viel. Rechnet: 29 · 40 Kerne, dann schauen, wie oft 376 hineinpasst."}]}
},
{ id:"g4", icon:"🦇", title:"Gruselparty", sub:"Einkaufen im Gruselmarkt",

  tipps:[

{ id:"g5", icon:"🕸️", title:"Spinnennetz", sub:"Wolle für unsere Tür",

  data:`<div style="display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:16px;align-items:center" class="mgrid">

      <line x1="110" y1="210" x2="10" y2="210"/><line x1="110" y1="210" x2="210" y2="210"/>
      <line x1="110" y1="210" x2="110" y2="10"/><line x1="110" y1="210" x2="110" y2="410"/>
      <line x1="110" y1="210" x2="10" y2="10"/><line x1="110" y1="210" x2="210" y2="10"/>

      <rect x="50" y="90" width="120" height="240"/><rect x="30" y="50" width="160" height="320"/>
    </g>
    <text x="114" y="40" font-size="14" font-weight="700" fill="#c0392b">Speiche</text>
    <text x="134" y="282" font-size="14" font-weight="700" fill="#1f5f99">Ring</text>
    <text x="104" y="216" font-size="22">🕷️</text>
  </svg>
  <div>
    <p style="margin-top:0"><b>So könnte euer Netz aussehen</b> (Beispiel):</p>
    <ul style="margin:0;padding-left:22px">
      <li><b style="color:#c0392b">Speichen</b> gehen von der Mitte zu den Ecken und Seiten der Tür.</li>

    <p>Ihr dürft auch ein eigenes Netz planen. Zeichnet es auf den Forscherbogen.</p>

  <div class="note">📏 Messt unsere Klassentür. <b>Ohne Meterstab?</b> Eine Tür ist meistens etwa 1 m breit und 2 m hoch.</div>
  <div class="assume">✏️ <b>Ihr entscheidet:</b> Wie viele Speichen und Ringe? Braucht ihr extra Wolle für die Knoten?</div>`,

// ---------- Ansichten ----------
const app = document.getElementById("app");
function go(h){ location.hash = h; }
window.addEventListener("hashchange", render);

function render(){
  const id = location.hash.replace("#","");
  const g = G.find(x => x.id === id);
  document.getElementById("homeBtn").classList.toggle("hidden", !g);
  window.scrollTo(0,0);
  if(!g){ renderHome(); return; }
  renderGroup(g);
}

function renderHome(){
  app.innerHTML = `
  <div class="card"><h2>Unser Plan für jede Aufgabe</h2>${PLAN}
    <div class="roles"><span>📏 Mess-Chef</span><span>✍️ Schreiber</span><span>⏱️ Zeitwächter</span><span>🎤 Präsentator</span></div></div>
  <div class="card" style="background:none;box-shadow:none;padding:0"><h2 style="margin-left:4px">Tippt auf eure Gruppe</h2>
  <div class="grid">${G.map((g,i)=>`<button class="tile" onclick="go('${g.id}')"><div class="ic">${g.icon}</div><div><span>Gruppe ${i+1}</span><b>${g.title}</b><span>${g.sub}</span></div></button>`).join("")}</div></div>`;
}

function rangeFb(ranges, v){
  for(const r of ranges){ if(v <= r.max) return r; }
  return ranges[ranges.length-1];
}
function parseNum(s){
  s = String(s).trim().replace(/\s|€/g,"");
  if(s.includes(",")) s = s.replace(/\./g,"").replace(",", ".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  return parseFloat(s.replace(/[^0-9.\-]/g,""));
}

function renderGroup(g){
  const n = G.indexOf(g)+1;
  app.innerHTML = `
  <div class="card"><span class="gnum">Gruppe ${n} · ${g.icon} ${g.title}</span>
    <div class="frage">${g.frage}</div>
    <div class="muted">Schreibt alles auf euren Forscherbogen: Bauchschätzung, Annahmen, Rechnung, Ergebnis.</div></div>
  <div class="card">${PLAN}</div>
  <div class="card"><h2>📋 Datenkarte</h2>${g.data}</div>
  <div class="card"><h2>💡 Tipps – erst selbst probieren!</h2>
    <div class="tipps">${g.tipps.map((t,i)=>`<button class="btn tipp" id="tb${i}" ${i>0?"disabled":""} onclick="showTipp(${i})">💡 Tipp ${i+1}</button>`).join("")}</div>
    <div id="tipBox"></div></div>
  <div class="card"><h2>✅ Ergebnis prüfen</h2>
    <div>${g.check.label}</div>
    <div class="check"><input id="res" inputmode="decimal" placeholder="?"><span class="u">${g.check.unit}</span><button class="btn main" onclick="checkRes()">prüfen</button></div>
    <div id="resFb"></div></div>
  <div class="card extra"><h2>★ Für schnelle Gruppen</h2><div>${g.extra}</div>
    ${g.extraCheck?`<div class="check"><input id="ex" inputmode="decimal" placeholder="?"><span class="u">${g.extraCheck.unit}</span><button class="btn main" onclick="checkEx()">prüfen</button></div><div id="exFb"></div>`:`<div class="muted" style="margin-top:6px">Schreibt eure Antwort auf die Rückseite des Forscherbogens.</div>`}</div>`;
  window._g = g;
  if(g.id==="g2") drawStreet();
  if(g.id==="g3") drawPumpkin();
  document.querySelectorAll(".mgrid").forEach(el=>{ if(window.innerWidth<640) el.style.gridTemplateColumns="1fr"; });
}

function showTipp(i){
  const g = window._g, box = document.getElementById("tipBox");
  if(!document.getElementById("tip"+i)){
    box.insertAdjacentHTML("beforeend", `<div class="hint" id="tip${i}"><span class="k">Tipp ${i+1}</span>${g.tipps[i]}</div>`);
  }
  const nb = document.getElementById("tb"+(i+1)); if(nb) nb.disabled = false;
}
function showFb(el, r){ el.innerHTML = `<div class="fb ${r.cls}">${r.cls==="good"?"✅":r.cls==="mid"?"🤔":"❌"} ${r.msg}</div>`; }
function checkRes(){
  const v = parseNum(document.getElementById("res").value), el = document.getElementById("resFb");
  if(isNaN(v)){ el.innerHTML = `<div class="fb mid">Gebt eine Zahl ein.</div>`; return; }
  showFb(el, rangeFb(window._g.check.ranges, v));
}
function checkEx(){
  const v = parseNum(document.getElementById("ex").value), el = document.getElementById("exFb");
  if(isNaN(v)){ el.innerHTML = `<div class="fb mid">Gebt eine Zahl ein.</div>`; return; }
  showFb(el, rangeFb(window._g.extraCheck.ranges, v));
}

// ---------- Gruppe 2: Straßenskizze ----------
function house(x,y,col){
  return `<g transform="translate(${x},${y})"><polygon points="0,14 13,2 26,14" fill="#8b5a3c"/><rect x="2" y="14" width="22" height="18" fill="${col}" stroke="#555" stroke-width="1"/><rect x="10" y="22" width="6" height="10" fill="#5a3b2a"/></g>`;
}
function drawStreet(){
  const cols = ["#f2d7a7","#d9e4f2","#e7d4ec","#d8ecd2"];
  let s = `<svg viewBox="0 0 640 250" aria-label="Straßenskizze mit Häusern">`;
  // Kürbisstraße: 12 oben, 12 unten
  s += `<text x="10" y="18" font-size="15" font-weight="800" fill="#d9661f">🎃 Kürbisstraße (24 Häuser)</text>`;
  s += `<rect x="10" y="60" width="620" height="22" fill="#bfbfbf"/>`;
  for(let i=0;i<12;i++){ s += house(14+i*51,24,cols[i%4]); s += house(14+i*51,86,cols[(i+2)%4]); }
  s += `<text x="10" y="148" font-size="15" font-weight="800" fill="#4b2e6b">👻 Gespensterweg (32 Häuser)</text>`;
  s += `<rect x="10" y="190" width="620" height="22" fill="#bfbfbf"/>`;
  for(let i=0;i<16;i++){ s += house(12+i*39,154,cols[(i+1)%4]); s += house(12+i*39,216,cols[(i+3)%4]); }
  s += `</svg>`;
  document.getElementById("street").innerHTML = s;
}

// ---------- Gruppe 3: Kürbis mit Kernen ----------
const SEEDS = 47;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function drawPumpkin(){
  // kleiner Kürbis von oben in 8 Stücke geteilt
  let p = `<circle cx="100" cy="100" r="88" fill="#e8822f" stroke="#a8541a" stroke-width="3"/>`;
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4 - Math.PI/2;
    p += `<line x1="100" y1="100" x2="${100+88*Math.cos(a)}" y2="${100+88*Math.sin(a)}" stroke="#7a3a10" stroke-width="2.5"/>`;
  }
  const a1=-Math.PI/2, a2=-Math.PI/4;
  p += `<path d="M100,100 L${100+88*Math.cos(a1)},${100+88*Math.sin(a1)} A88,88 0 0,1 ${100+88*Math.cos(a2)},${100+88*Math.sin(a2)} Z" fill="#ffd27a" stroke="#7a3a10" stroke-width="3"/>`;
  p += `<circle cx="100" cy="100" r="8" fill="#4f7a2b"/>`;
  document.getElementById("pie").innerHTML = p;

  // großes Stück: Keil 45°, Spitze unten
  const cx=260, cy=455, R=430, half=Math.PI/8; // 22,5° nach links und rechts
  const L = [cx - R*Math.sin(half), cy - R*Math.cos(half)], Rr=[cx + R*Math.sin(half), cy - R*Math.cos(half)];
  let w = `<path d="M${cx},${cy} L${L[0]},${L[1]} A${R},${R} 0 0,1 ${Rr[0]},${Rr[1]} Z" fill="#f6b05a" stroke="#a8541a" stroke-width="4"/>`;
  w += `<path d="M${cx},${cy-30} L${cx-R*0.82*Math.sin(half)},${cy-R*0.82*Math.cos(half)} A${R*0.82},${R*0.82} 0 0,1 ${cx+R*0.82*Math.sin(half)},${cy-R*0.82*Math.cos(half)} Z" fill="#f9c97e" opacity=".8"/>`;
  // Fasern
  const rnd = mulberry32(31);
  for(let i=0;i<14;i++){
    const ang=(rnd()*2-1)*half*0.8, r1=60+rnd()*250, r2=r1+40+rnd()*60;
    w += `<path d="M${cx+r1*Math.sin(ang)},${cy-r1*Math.cos(ang)} Q${cx+(r1+r2)/2*Math.sin(ang)+15},${cy-(r1+r2)/2*Math.cos(ang)} ${cx+r2*Math.sin(ang+0.04)},${cy-r2*Math.cos(ang+0.04)}" stroke="#e09442" stroke-width="2" fill="none"/>`;
  }
  // Kerne platzieren: gerüttelte Gitterpunkte im Keil, fester Zufall -> immer gleich
  const cand=[];
  for(let y=cy-90; y>cy-400; y-=28){
    for(let x=cx-200; x<=cx+200; x+=32){
      const xx = x + (rnd()-0.5)*8 + ((Math.round((cy-y)/28))%2 ? 16 : 0), yy = y + (rnd()-0.5)*10;
      const dx=xx-cx, dy=cy-yy, r=Math.hypot(dx,dy), ang=Math.atan2(dx,dy);
      if(r<70 || r>R-24) continue;
      if(r*Math.sin(half-Math.abs(ang)) < 20) continue;
      cand.push({x:xx,y:yy,rot:Math.round(rnd()*180)});
    }
  }
  for(let i=cand.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [cand[i],cand[j]]=[cand[j],cand[i]]; }
  const pts = cand.slice(0, SEEDS);
  w += pts.map((q,i)=>`<g class="seed" data-i="${i}" transform="translate(${q.x.toFixed(1)},${q.y.toFixed(1)}) rotate(${q.rot})" onclick="toggleSeed(this)"><ellipse rx="13" ry="8" fill="#fbf3dc" stroke="#b39a6a" stroke-width="2"/><circle class="mk" r="5" fill="#c0392b" style="display:none"/><rect x="-15" y="-12" width="30" height="24" fill="transparent"/></g>`).join("");
  document.getElementById("wedge").innerHTML = w;
  window._seedCount = pts.length;
}
function toggleSeed(el){ const m = el.querySelector(".mk"); m.style.display = m.style.display==="none" ? "" : "none"; }
function clearSeeds(){ document.querySelectorAll(".seed .mk").forEach(m=>m.style.display="none"); }
function checkCount(){
  const v = parseNum(document.getElementById("cnt").value), el = document.getElementById("cntFb");
  if(isNaN(v)){ el.innerHTML = `<div class="fb mid">Gebt eine Zahl ein.</div>`; return; }
  if(v === SEEDS) showFb(el,{cls:"good",msg:"Richtig gezählt! In einem Stück sind 47 Kerne."});
  else if(Math.abs(v-SEEDS)<=3) showFb(el,{cls:"mid",msg:"Fast! Löscht die Markierungen und zählt noch einmal genau."});
  else showFb(el,{cls:"bad",msg:"Das passt noch nicht. Tippt jeden Kern an und zählt noch einmal."});
}

render();
</script>
